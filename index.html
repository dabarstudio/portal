<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal do escritório</title>
<meta name="robots" content="noindex">
<meta name="description" content="Portal para escritórios de contabilidade e seus clientes: documentos, guias, obrigações e tarefas.">
<meta property="og:type" content="website"><meta property="og:title" content="Portal · Dabar">
<meta property="og:description" content="Portal para escritórios de contabilidade e seus clientes: documentos, guias, obrigações e tarefas.">
<meta property="og:image" content="https://dabarstudio.github.io/portal/dabar-og.jpg"><meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#4F5D33">
<link rel="icon" href="dabar-icon.png"><link rel="apple-touch-icon" id="lnkApple" href="dabar-icon.png"><link rel="manifest" id="lnkMan" href="m/dabar.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" id="mtApp" content="Dabar">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cor:#4F5D33;--cor-cl:#eef1e8;--tx:#1d2420;--tx2:#5b655e;--ln:#e2e6e1;--bg:#f6f7f4;--card:#fff;--ok:#2f7d4f;--warn:#b7791f;--err:#b83a3a;--info:#2b6cb0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,sans-serif}
button,input,select,textarea{font:inherit}
a{color:var(--cor)}
.hide{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
/* login */
#vLogin{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.lbox{width:100%;max-width:400px;background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:28px 24px;box-shadow:0 10px 30px rgba(0,0,0,.05)}
.lbox .lg{display:block;max-width:180px;max-height:120px;margin:0 auto 10px}
.lbox h1{font-size:1.15rem;text-align:center;margin:4px 0 18px}
label{display:block;font-size:.85rem;font-weight:600;color:var(--tx2);margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:#fff;color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--cor);outline-offset:0;border-color:var(--cor)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:10px 16px;background:var(--cor);color:#fff;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--cor-cl);color:var(--cor)}
.btn.ghost{background:transparent;color:var(--cor);border:1px solid var(--ln)}
.btn.sm{padding:6px 10px;font-size:.85rem;border-radius:8px}
.btn.red{background:#fbeaea;color:var(--err)}
.btn:disabled{opacity:.5;cursor:default}
.full{width:100%;margin-top:18px}
.msg{font-size:.88rem;margin-top:10px;min-height:1.2em}
.msg.err{color:var(--err)} .msg.ok{color:var(--ok)}
.note{font-size:.85rem;color:var(--tx2)}
/* app */
header.top{background:#fff;border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:5}
header.top .wrap{display:flex;align-items:center;gap:10px;min-height:64px}
header.top img{height:44px;width:auto}
header.top .nm{font-weight:700;line-height:1.2;min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header.top .nm small{overflow:hidden;text-overflow:ellipsis}
header.top .nm small{display:block;font-weight:400;color:var(--tx2);font-size:.8rem}
header.top .sp{flex:1}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--ln);background:#fff}
nav.tabs .wrap{display:flex;gap:4px}
nav.tabs button{background:none;border:0;padding:12px 14px;color:var(--tx2);font-weight:600;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--cor);border-bottom-color:var(--cor)}
main{padding:20px 0 90px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:18px;margin-bottom:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sb{justify-content:space-between}
h2{font-size:1.2rem;margin:0 0 4px} h3{font-size:1rem;margin:0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr))}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--ln);vertical-align:middle}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--tx2);font-weight:600}
.chip{display:inline-block;font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.st-pendente{background:#f1f2ef;color:#5b655e}.st-enviado{background:#e6f0fb;color:var(--info)}.st-aprovado{background:#e5f3ea;color:var(--ok)}.st-recusado{background:#fbeaea;color:var(--err)}.st-nao_se_aplica{background:#f3f0f7;color:#6b5b8a}
.bar{height:8px;background:#eef0ec;border-radius:99px;overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:var(--cor)}
.item{border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:10px;background:#fff}
.item .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.item .fl{margin:8px 0 0;padding:0;list-style:none}
.item .fl li{display:flex;gap:8px;align-items:center;font-size:.88rem;padding:4px 0;flex-wrap:wrap}
.item .fl a{cursor:pointer;word-break:break-all}
.obs{font-size:.85rem;margin-top:6px;padding:8px 10px;border-radius:8px;background:#fbeaea;color:var(--err)}
.up{display:inline-flex}
.up input{display:none}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font-size:1.4rem}
.kpi span{font-size:.8rem;color:var(--tx2)}
button.kpi{font:inherit;text-align:left;cursor:pointer;color:inherit;width:100%}button.kpi:hover{border-color:var(--cor)}button.kpi[aria-pressed="true"]{border-color:var(--cor);box-shadow:inset 0 0 0 2px var(--cor);background:var(--cor-cl)}
dialog{border:0;border-radius:14px;padding:0;max-width:520px;width:calc(100% - 32px);box-shadow:0 20px 50px rgba(0,0,0,.2)}
dialog form{padding:20px}
dialog::backdrop{background:rgba(20,25,22,.45)}
.dlgft{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
footer.by{position:fixed;bottom:0;left:0;right:0;text-align:center;font-size:.72rem;color:var(--tx2);padding:6px;background:rgba(246,247,244,.92);border-top:1px solid var(--ln)}
.empty{padding:24px;text-align:center;color:var(--tx2)}
.sinoW{position:relative}
.sinoN{position:absolute;top:-6px;right:-6px;background:var(--err);color:#fff;border-radius:99px;font-size:.7rem;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.sinoP{position:absolute;right:0;top:44px;width:min(360px,calc(100vw - 32px));max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--ln);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.12);z-index:20}
.sinoP .nt{padding:10px 14px;border-bottom:1px solid var(--ln);cursor:pointer;font-size:.88rem}
.sinoP .nt.nova{background:var(--cor-cl)}
.sinoP .nt small{display:block;color:var(--tx2);font-size:.75rem}
.kb{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.kcol{background:#eef0ec;border-radius:12px;padding:10px;min-height:200px}
.kcol h3{font-size:.9rem;margin:2px 4px 10px;display:flex;justify-content:space-between}
.kcol.over{outline:2px dashed var(--cor)}
.kc{background:#fff;border:1px solid var(--ln);border-radius:10px;padding:10px;margin-bottom:8px;cursor:grab;font-size:.9rem}
.kc .mt{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:.75rem;color:var(--tx2)}
.kc.atr{border-left:4px solid var(--err)}
.cal td.c{text-align:center;padding:6px 4px}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle;cursor:pointer;border:0}
.d-aberta{background:#2f6b45}.d-ok{background:#9fd3ae}.d-atr{background:#8e1f1f}.d-tarde{background:#e7a3a3}.d-sm{background:#c9c3d6}
.chat{display:flex;flex-direction:column;gap:8px;max-height:55vh;overflow:auto;padding:4px}
.bal{max-width:80%;padding:8px 12px;border-radius:12px;font-size:.92rem;white-space:pre-wrap;word-break:break-word}
.bal.eu{align-self:flex-end;background:var(--cor);color:#fff}
.bal.ele{align-self:flex-start;background:#eef0ec}
.bal small{display:block;font-size:.7rem;opacity:.75;margin-top:2px}
.lst{list-style:none;margin:0;padding:0}
.lst li{padding:10px 0;border-bottom:1px solid var(--ln);cursor:pointer}
.lst li.on{font-weight:700}
.pix{font-family:ui-monospace,monospace;font-size:.75rem;word-break:break-all;background:#f6f7f4;border-radius:8px;padding:6px 8px}
@media (max-width:640px){header.top img{height:36px} th.hm,td.hm{display:none} .card{padding:14px}}
</style>
</head>
<body>

<section id="vLogin">
  <div class="lbox">
    <img class="lg hide" id="lgLogo" alt="">
    <h1 id="lgNome">Portal do escritório</h1>
    <form id="fLogin" autocomplete="on">
      <label for="lEmail">E-mail</label><input id="lEmail" type="email" autocomplete="username" required>
      <label for="lSenha">Senha</label><input id="lSenha" type="password" autocomplete="current-password" required>
      <button class="btn full" type="submit">Entrar</button>
      <p class="msg" id="lMsg" role="alert"></p>
      <p class="note">Esqueceu a senha? Peça ao administrador do seu escritório para gerar uma senha provisória.</p>
    </form>
  </div>
</section>

<section id="vTrocar" class="hide" style="min-height:100vh;display:grid;place-items:center;padding:24px 16px">
  <div class="lbox">
    <h1>Crie a sua senha</h1>
    <p class="note">Por segurança, troque a senha provisória por uma senha só sua.</p>
    <form id="fTrocar">
      <label for="tS1">Nova senha</label><input id="tS1" type="password" autocomplete="new-password" required minlength="8">
      <label for="tS2">Repita a nova senha</label><input id="tS2" type="password" autocomplete="new-password" required minlength="8">
      <p class="note">Mínimo de 8 caracteres, com letras e números.</p>
      <button class="btn full" type="submit">Salvar senha</button>
      <p class="msg" id="tMsg" role="alert"></p>
    </form>
  </div>
</section>

<section id="vApp" class="hide">
  <header class="top"><div class="wrap">
    <img id="hLogo" class="hide" alt="">
    <div class="nm"><span id="hNome"></span><small id="hUser"></small></div>
    
    <select id="hEsc" class="hide" style="width:auto" aria-label="Escritório"></select>
    <button class="btn ghost sm hide" id="bInst" type="button" title="Instalar o app no celular" aria-label="Instalar o app">📲</button>
    <div class="sinoW"><button class="btn ghost sm" id="bSino" type="button" aria-label="Avisos" aria-expanded="false">🔔<span id="sinoN" class="sinoN hide">0</span></button><div id="sinoP" class="sinoP hide" role="dialog" aria-label="Avisos"></div></div>
    <button class="btn ghost sm" id="bSair" type="button">Sair</button>
  </div></header>
  <nav class="tabs" aria-label="Seções"><div class="wrap" id="tabs"></div></nav>
  <main class="wrap" id="conteudo"></main>
</section>
<footer class="by"><img src="dabar-icon.png" alt="" width="14" height="14" style="vertical-align:-2px;margin-right:4px">Tecnologia Dabar</footer>

<dialog id="dlg"><form method="dialog" id="dlgF"></form></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
"use strict";
const SB_URL = "https://ixwhkwbrhcdhxzpdqhbd.supabase.co";
const SB_KEY = "sb_publishable_Hgesd1C8xHT9I9S9o8h2qg_kSFtDdZ7";
const sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: "dabar-portal-auth" } });
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ST = { pendente: "Pendente", enviado: "Enviado", aprovado: "Aprovado", recusado: "Recusado", nao_se_aplica: "Não se aplica" };
const chip = (s) => `<span class="chip st-${s}">${ST[s] || s}</span>`;
const mesNome = (c) => { const [a, m] = c.split("-"); return ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"][+m - 1] + "/" + a; };
const dataBR = (d) => d ? d.split("-").reverse().join("/") : "—";
const compAnterior = () => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1); return d.toISOString().slice(0, 7); };
function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch { /* ok */ } }

const S = { user: null, vital: false, membros: [], esc: null, papel: null, tab: null, comp: compAnterior(), clientes: [], abre: null };

/* ---------- marca ---------- */
const DABAR = { nome: "Dabar", logo_url: "dabar-logo.png", cor: "#1F2A33" };
function slugAtual() { const q = new URLSearchParams(location.search).get("e"); return q ? q.toLowerCase() : ""; }
function aplicarMarca(m) {
  if (!m) return;
  try { marcaApp(m, m === DABAR ? null : (m.slug || slugAtual())); } catch { /* ok */ }
  document.documentElement.style.setProperty("--cor", m.cor || "#4F5D33");
  document.documentElement.style.setProperty("--cor-cl", clarear(m.cor || "#4F5D33"));
  $('meta[name="theme-color"]').content = m.cor || "#4F5D33";
  document.title = (m.nome || "Portal") + " · Portal";
  for (const [img, nm] of [[$("#lgLogo"), $("#lgNome")], [$("#hLogo"), $("#hNome")]]) {
    if (m.logo_url) { img.src = m.logo_url; img.alt = m.nome; img.classList.remove("hide"); } else img.classList.add("hide");
    nm.textContent = m === DABAR ? (img.id === "lgLogo" ? "Acesso à plataforma" : "Área da Dabar") : (m.logo_url && img.id === "lgLogo" ? "Portal do cliente" : m.nome);
  }
}
async function corDaLogo(u) {
  const img = await new Promise((ok, err) => { const i = new Image(); i.onload = () => ok(i); i.onerror = err; i.src = u; });
  const cv = document.createElement("canvas"); cv.width = cv.height = 48; const cx = cv.getContext("2d"); cx.drawImage(img, 0, 0, 48, 48);
  const d = cx.getImageData(0, 0, 48, 48).data, cont = {};
  for (let i = 0; i < d.length; i += 4) { const [r, g, b, a] = [d[i], d[i + 1], d[i + 2], d[i + 3]]; if (a < 200) continue; const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    if (mx > 235 && mn > 235) continue; if (mx < 25) continue; if (mx - mn < 30) continue; const k = [r, g, b].map((x) => Math.round(x / 24) * 24).join(","); cont[k] = (cont[k] || 0) + 1; }
  const top = Object.entries(cont).sort((a, b) => b[1] - a[1])[0]; if (!top) return null;
  let [r, g, b] = top[0].split(",").map(Number); const lum = (0.299 * r + 0.587 * g + 0.114 * b); if (lum > 150) { const f = 150 / lum; r *= f; g *= f; b *= f; }
  return "#" + [r, g, b].map((x) => Math.max(0, Math.min(255, Math.round(x))).toString(16).padStart(2, "0")).join("");
}
function clarear(hex) { const n = parseInt(hex.slice(1), 16); const r = n >> 16, g = (n >> 8) & 255, b = n & 255; const f = (x) => Math.round(x + (255 - x) * 0.88); return `rgb(${f(r)},${f(g)},${f(b)})`; }

/* ---------- login ---------- */
$("#fLogin").addEventListener("submit", async (e) => {
  e.preventDefault(); const m = $("#lMsg"); m.className = "msg"; m.textContent = "Entrando…";
  const { error } = await sb.auth.signInWithPassword({ email: $("#lEmail").value.trim(), password: $("#lSenha").value });
  if (error) { m.className = "msg err"; m.textContent = "E-mail ou senha incorretos."; return; }
  m.textContent = ""; iniciar();
});
$("#fTrocar").addEventListener("submit", async (e) => {
  e.preventDefault(); const a = $("#tS1").value, b = $("#tS2").value, m = $("#tMsg");
  if (a !== b) { m.className = "msg err"; m.textContent = "As senhas não são iguais."; return; }
  if (a.length < 8 || !/[A-Za-z]/.test(a) || !/[0-9]/.test(a)) { m.className = "msg err"; m.textContent = "Use 8 caracteres ou mais, com letras e números."; return; }
  const { error } = await sb.auth.updateUser({ password: a, data: { trocar_senha: false } });
  if (error) { m.className = "msg err"; m.textContent = error.message.includes("different") ? "Use uma senha diferente da provisória." : "Não foi possível salvar. Tente de novo."; return; }
  iniciar();
});
$("#bSair").addEventListener("click", async () => { await sb.auth.signOut(); location.reload(); });

function mostrar(v) { for (const id of ["vLogin", "vTrocar", "vApp"]) $("#" + id).classList.toggle("hide", id !== v); }

async function iniciar() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { mostrar("vLogin"); return; }
  S.user = session.user;
  if (S.user.user_metadata && S.user.user_metadata.trocar_senha) { mostrar("vTrocar"); return; }
  const [{ data: mem }, { data: vital }] = await Promise.all([
    sb.from("wl_membros").select("escritorio, papel, nome, wl_escritorios(id, slug, nome, logo_url, cor, prazo_dia, pix_chave, pix_nome, pix_cidade)").eq("user_id", S.user.id),
    sb.rpc("wl_sou_vital"),
  ]);
  S.membros = (mem || []).filter((m) => m.wl_escritorios); S.vital = !!vital;
  if (!S.membros.length && !S.vital) { await sb.auth.signOut(); mostrar("vLogin"); $("#lMsg").className = "msg err"; $("#lMsg").textContent = "Este acesso não está ligado a nenhum escritório."; return; }
  const slug = slugAtual();
  const m = S.membros.find((x) => x.wl_escritorios.slug === slug) || S.membros[0];
  if (m && !(S.vital && !slug && S.membros.length === 0)) escolherEsc(m); else { S.esc = null; S.papel = null; aplicarMarca(DABAR); history.replaceState(null, "", location.pathname); }
  const sel = $("#hEsc");
  if (S.membros.length > 1) { sel.innerHTML = S.membros.map((x) => `<option value="${x.escritorio}">${esc(x.wl_escritorios.nome)}</option>`).join(""); sel.value = S.esc && S.esc.id; sel.classList.remove("hide"); }
  $("#hUser").textContent = (m && m.nome) || S.user.email;
  $(".sinoW").classList.toggle("hide", !S.esc);
  mostrar("vApp"); montarTabs(); if (S.esc) iniciarSino();
}
$("#hEsc").addEventListener("change", (e) => { const m = S.membros.find((x) => x.escritorio === e.target.value); escolherEsc(m); S.tab = null; montarTabs(); });
function escolherEsc(m) { S.esc = m.wl_escritorios; S.papel = m.papel; lsSet("dabar-esc", S.esc.slug); aplicarMarca(S.esc); history.replaceState(null, "", "?e=" + S.esc.slug); }

/* ---------- abas ---------- */
function abas() {
  const t = [];
  if (S.papel === "cliente") t.push(["inicio", "Início"], ["guias", "Guias"], ["meus", "Documentos"], ["msgs", "Mensagens"]);
  if (S.papel === "admin" || S.papel === "equipe") t.push(["painel", "Painel"], ["docs", "Documentos"], ["guias", "Guias e honorários"], ["obrig", "Obrigações"], ["proc", "Processos"], ["quadro", "Tarefas"], ["msgs", "Mensagens"], ["clientes", "Clientes"], ["lista", "Lista do mês"]);
  if (S.papel === "admin") t.push(["acessos", "Acessos"], ["marca", "Escritório"]);
  if (S.vital && !S.suporte) t.push(["vital", "Escritórios (Dabar)"]);
  return t;
}
function montarTabs() {
  const t = abas(); if (!t.find((x) => x[0] === S.tab)) S.tab = t[0] && t[0][0];
  $("#tabs").innerHTML = t.map(([k, n]) => `<button type="button" role="tab" data-t="${k}" aria-selected="${k === S.tab}">${n}</button>`).join("");
  render();
}
$("#tabs").addEventListener("click", (e) => { const b = e.target.closest("[data-t]"); if (!b) return; if (b.dataset.t === "quadro") { location.href = "quadro/?e=" + encodeURIComponent(S.esc.slug); return; } S.tab = b.dataset.t; S.abre = null; montarTabs(); });
function irPara(tab, extra) { S.tab = tab; S.abre = (extra && extra.cliente) || null; if (extra && extra.comp) S.comp = extra.comp; montarTabs(); }
function render() { const c = $("#conteudo"); c.innerHTML = '<div class="empty">Carregando…</div>'; ({ inicio: vInicio, meus: vMeus, docs: vDocs, guias: vGuias, obrig: vObrig, painel: vPainel, proc: vProc, msgs: vMsgs, clientes: vClientes, lista: vLista, ficha: vFicha, quadro: vQuadro, acessos: vAcessos, marca: vMarca, vital: vVital })[S.tab](c).catch((e) => { c.innerHTML = `<div class="card"><p class="msg err">Algo deu errado: ${esc(e.message || e)}</p></div>`; }); }

/* ---------- diálogo simples ---------- */
function dialogo(titulo, campos, okTxt = "Salvar") {
  return new Promise((res) => {
    const d = $("#dlg"), f = $("#dlgF");
    f.innerHTML = `<h2>${esc(titulo)}</h2>` + campos.map((c) => c.tipo === "info" ? `<p class="note">${esc(c.texto)}</p>` :
      `<label for="dg_${c.k}">${esc(c.rot)}</label>` + (c.tipo === "select" ? `<select id="dg_${c.k}">${c.ops.map(([v, n]) => `<option value="${esc(v)}" ${v === c.v ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>`
      : c.tipo === "area" ? `<textarea id="dg_${c.k}" rows="3">${esc(c.v || "")}</textarea>` : `<input id="dg_${c.k}" type="${c.tipo === "dinheiro" ? "text" : (c.tipo || "text")}" ${c.tipo === "dinheiro" ? 'inputmode="decimal" placeholder="Ex.: 1.250,50"' : ""} value="${esc(c.v || "")}" ${c.req ? "required" : ""} ${c.ac ? `autocomplete="${c.ac}"` : ""}>`)).join("")
      + `<p class="msg err" id="dgMsg"></p><div class="dlgft"><button class="btn ghost" value="x" formnovalidate>Cancelar</button><button class="btn" value="ok">${esc(okTxt)}</button></div>`;
    const fim = () => { const ok = d.returnValue === "ok"; d.removeEventListener("close", fim); if (!ok) return res(null); const o = {}; campos.forEach((c) => { if (c.k) o[c.k] = $("#dg_" + c.k).value.trim(); }); res(o); };
    d.addEventListener("close", fim); d.returnValue = ""; d.showModal();
  });
}
async function confirmar(txt) { const r = await dialogo("Confirmar", [{ tipo: "info", texto: txt }], "Confirmar"); return !!r; }
function aviso(txt, ok = true) { const n = document.createElement("div"); n.textContent = txt; n.setAttribute("role", "status"); n.style.cssText = `position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:${ok ? "#1d2420" : "#b83a3a"};color:#fff;padding:10px 16px;border-radius:10px;z-index:99;font-size:.9rem;max-width:90vw`; document.body.appendChild(n); setTimeout(() => n.remove(), 3500); }

/* ---------- dados comuns ---------- */
async function carregarClientes() { const { data } = await sb.from("wl_clientes").select("*").eq("escritorio", S.esc.id).order("nome"); S.clientes = data || []; return S.clientes; }
async function abrirArquivo(path) { const { data, error } = await sb.storage.from("wl-docs").createSignedUrl(path, 300); if (error) return aviso("Não foi possível abrir o arquivo.", false); window.open(data.signedUrl, "_blank", "noopener"); }
const nomeSeguro = (n) => n.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9._-]+/g, "_").slice(-80);
async function enviarArquivos(item, files) {
  let n = 0;
  for (const f of files) {
    if (f.size > 25 * 1024 * 1024) { aviso(`"${f.name}" passa de 25 MB.`, false); continue; }
    const path = `${item.escritorio}/${item.cliente}/${item._comp}/${item.id}/${Date.now()}-${nomeSeguro(f.name)}`;
    const { error } = await sb.storage.from("wl-docs").upload(path, f, { upsert: false, contentType: f.type || undefined });
    if (error) { aviso(`Falha ao enviar "${f.name}".`, false); continue; }
    const { error: e2 } = await sb.from("wl_doc_arquivo").insert({ item: item.id, escritorio: item.escritorio, cliente: item.cliente, path, nome: f.name, tamanho: f.size });
    if (e2) { await sb.storage.from("wl-docs").remove([path]); aviso(`Falha ao registrar "${f.name}".`, false); continue; }
    n++;
  }
  return n;
}
async function itensDaComp(compId, compTxt) {
  const { data: it } = await sb.from("wl_doc_item").select("*").eq("comp", compId).order("ordem").order("id");
  const ids = (it || []).map((i) => i.id);
  const { data: arq } = ids.length ? await sb.from("wl_doc_arquivo").select("*").in("item", ids).order("criado_em") : { data: [] };
  return (it || []).map((i) => ({ ...i, _comp: compTxt, arquivos: (arq || []).filter((a) => a.item === i.id) }));
}
function itemHTML(i, modo) {
  const pode = modo === "cliente" ? i.status !== "aprovado" && i.status !== "nao_se_aplica" : true;
  const arqs = i.arquivos.map((a) => `<li>📄 <a data-abre="${esc(a.path)}">${esc(a.nome)}</a> <span class="note">${(a.tamanho / 1024 / 1024).toFixed(1)} MB · ${new Date(a.criado_em).toLocaleDateString("pt-BR")}</span>${(modo === "equipe" || (pode && a.enviado_por === S.user.id)) ? ` <button class="btn ghost sm" data-rmarq="${a.id}" type="button" aria-label="Remover ${esc(a.nome)}">Remover</button>` : ""}</li>`).join("");
  const acoesEq = modo === "equipe" ? `<button class="btn sm" data-st="aprovado" data-it="${i.id}" type="button">Aprovar</button><button class="btn red sm" data-st="recusado" data-it="${i.id}" type="button">Recusar</button><button class="btn ghost sm" data-st="nao_se_aplica" data-it="${i.id}" type="button">Não se aplica</button>${i.status !== "pendente" ? `<button class="btn ghost sm" data-st="pendente" data-it="${i.id}" type="button">Voltar a pendente</button>` : ""}` : "";
  return `<div class="item"><div class="hd"><div><h3>${esc(i.nome)}</h3>${i.descricao ? `<div class="note">${esc(i.descricao)}</div>` : ""}</div>${chip(i.status)}</div>
    ${i.status === "recusado" && i.obs ? `<div class="obs"><b>Motivo:</b> ${esc(i.obs)}</div>` : ""}
    ${arqs ? `<ul class="fl">${arqs}</ul>` : ""}
    <div class="row" style="margin-top:10px">${pode ? `<label class="up btn sec sm" style="margin:0">📎 Enviar arquivo<input type="file" multiple data-up="${i.id}"></label>` : ""}${acoesEq}</div></div>`;
}
function ligarItens(el, itens, recarregar, modo) {
  el.onclick = async (e) => {
    const a = e.target.closest("[data-abre]"); if (a) return abrirArquivo(a.dataset.abre);
    const r = e.target.closest("[data-rmarq]");
    if (r) { const arq = itens.flatMap((i) => i.arquivos).find((x) => String(x.id) === r.dataset.rmarq); if (!(await confirmar(`Remover "${arq.nome}"?`))) return;
      await sb.storage.from("wl-docs").remove([arq.path]); const { error } = await sb.from("wl_doc_arquivo").delete().eq("id", arq.id); if (error) aviso("Não foi possível remover.", false); return recarregar(); }
    const s = e.target.closest("[data-st]");
    if (s) { let obs = null; if (s.dataset.st === "recusado") { const r2 = await dialogo("Recusar documento", [{ k: "obs", rot: "O que o cliente precisa corrigir?", tipo: "area" }], "Recusar"); if (!r2) return; obs = r2.obs || null; }
      const { error } = await sb.from("wl_doc_item").update({ status: s.dataset.st, obs, atualizado_em: new Date().toISOString(), atualizado_por: S.user.id }).eq("id", +s.dataset.it);
      if (error) aviso("Não foi possível atualizar.", false); return recarregar(); }
  };
  el.onchange = async (e) => {
    const inp = e.target.closest("[data-up]"); if (!inp || !inp.files.length) return;
    const item = itens.find((i) => String(i.id) === inp.dataset.up); aviso("Enviando…");
    const n = await enviarArquivos(item, [...inp.files]);
    if (n && modo === "cliente") { const { error } = await sb.rpc("wl_item_enviado", { p_item: item.id }); if (error) aviso("Arquivo salvo, mas o status não mudou.", false); }
    if (n) aviso(n === 1 ? "Arquivo enviado." : `${n} arquivos enviados.`); recarregar();
  };
}

/* ---------- cliente: meus documentos ---------- */
async function vMeus(c) {
  const { data: lig } = await sb.from("wl_cliente_usuarios").select("cliente, wl_clientes(id, nome, escritorio)").eq("user_id", S.user.id);
  const cls = (lig || []).map((l) => l.wl_clientes).filter((x) => x && x.escritorio === S.esc.id);
  if (!cls.length) { c.innerHTML = '<div class="card empty">Nenhuma empresa ligada ao seu acesso. Fale com o escritório.</div>'; return; }
  const cli = cls.find((x) => x.id === S.abre) || cls[0];
  const { data: comps } = await sb.from("wl_doc_comp").select("*").eq("cliente", cli.id).order("competencia", { ascending: false }).limit(12);
  if (!comps || !comps.length) { c.innerHTML = `<div class="card empty">Ainda não há lista de documentos para ${esc(cli.nome)}. O escritório abre a lista todo mês.</div>`; return; }
  const comp = comps.find((x) => x.competencia === S.comp) || comps[0];
  const itens = await itensDaComp(comp.id, comp.competencia);
  const falta = itens.filter((i) => i.status === "pendente" || i.status === "recusado").length;
  const dias = comp.prazo ? Math.ceil((new Date(comp.prazo + "T23:59") - new Date()) / 864e5) : null;
  c.innerHTML = `<div class="card"><div class="row sb"><div><h2>Documentos de ${esc(mesNome(comp.competencia))}</h2><div class="note">${esc(cli.nome)} · prazo de envio: <b>${dataBR(comp.prazo)}</b>${dias != null && falta ? (dias >= 0 ? ` · faltam ${dias} dia(s)` : ` · <span style="color:var(--err)">prazo vencido</span>`) : ""}</div></div>
    <div class="row">${cls.length > 1 ? `<select id="mCli" style="width:auto">${cls.map((x) => `<option value="${x.id}" ${x.id === cli.id ? "selected" : ""}>${esc(x.nome)}</option>`).join("")}</select>` : ""}
    <select id="mComp" style="width:auto" aria-label="Mês">${comps.map((x) => `<option value="${x.competencia}" ${x.id === comp.id ? "selected" : ""}>${mesNome(x.competencia)}</option>`).join("")}</select></div></div>
    <p class="note" style="margin-top:10px">${falta ? `Faltam <b>${falta}</b> de ${itens.length} itens. Toque em <b>Enviar arquivo</b> em cada item. Pode enviar foto, PDF ou planilha.` : "✅ Tudo enviado neste mês. Obrigado!"}</p></div><div id="mItens">${itens.map((i) => itemHTML(i, "cliente")).join("")}</div>`;
  const re = () => render();
  ligarItens($("#mItens"), itens, re, "cliente");
  $("#mComp").onchange = (e) => { S.comp = e.target.value; render(); };
  if ($("#mCli")) $("#mCli").onchange = (e) => { S.abre = e.target.value; render(); };
}

    const cnt = (s) => ii.filter((i) => i.status === s).length; const tot = ii.length, ok = cnt("aprovado") + cnt("nao_se_aplica");

    <div class="card tw">${linhas.length ? `<table><thead><tr><th>Cliente</th><th>Andamento</th><th class="hm">Para conferir</th><th class="hm">Faltando</th><th class="hm">Prazo</th><th></th></tr></thead><tbody>
    ${linhas.map((l) => `<tr><td><b>${esc(l.cl.nome)}</b></td><td>${l.cp ? `<div class="row" style="gap:8px"><div class="bar" style="flex:1"><i style="width:${l.tot ? Math.round(100 * l.ok / l.tot) : 0}%"></i></div><span class="note">${l.ok}/${l.tot}</span></div>` : '<span class="note">Lista não aberta</span>'}</td>
      <td class="hm">${l.env ? `<span class="chip st-enviado">${l.env}</span>` : "—"}</td><td class="hm">${l.pend + l.rec || "—"}</td><td class="hm">${l.cp ? dataBR(l.cp.prazo) : "—"}</td>
      <td style="text-align:right">${l.cp ? `<button class="btn sec sm" data-abrir="${l.cl.id}" type="button">Abrir</button>` : `<button class="btn ghost sm" data-gerar="${l.cl.id}" type="button">Abrir lista</button>`}</td></tr>`).join("")}</tbody></table>`

/* ---------- ficha do cliente (o "ambiente" dele visto pelo escritório) ---------- */
function abrirFicha(id) { if (!id) return; if (S.tab !== "ficha") S.fichaVolta = S.tab; S.fichaCli = id; S.tab = "ficha"; document.querySelectorAll("#tabs [data-t]").forEach((b) => b.setAttribute("aria-selected", "false")); render(); window.scrollTo({ top: 0 }); }
document.addEventListener("click", (e) => { const a = e.target.closest("[data-ficha]"); if (!a || !S.esc) return; e.preventDefault(); e.stopPropagation(); abrirFicha(a.dataset.ficha); }, true);
const linkCli = (id, nome) => `<a href="#" data-ficha="${id}" class="lkcli">${esc(nome)}</a>`;
async function vFicha(c) {

  if (!cl) { c.innerHTML = '<div class="card empty">Cliente não encontrado.</div>'; return; }
  const hj = hojeISO();
  const [{ data: cps }, { data: gs }, { data: ens }, { data: prs }, { data: ms }, { data: us }] = await Promise.all([
    sb.from("wl_doc_comp").select("id, competencia, prazo").eq("cliente", cl.id).eq("competencia", S.comp),
    sb.from("wl_guias").select("*").eq("cliente", cl.id).order("vencimento", { ascending: false }).limit(12),
    sb.from("wl_obrig_entrega").select("*, wl_obrigacoes(nome)").eq("cliente", cl.id).eq("competencia", S.comp).order("vencimento"),
    sb.from("wl_processo").select("*").eq("cliente", cl.id).order("iniciado_em", { ascending: false }),
    sb.from("wl_mensagens").select("*").eq("cliente", cl.id).order("criado_em", { ascending: false }).limit(5),
    sb.from("wl_cliente_usuarios").select("user_id").eq("cliente", cl.id)]);
  const cp = (cps || [])[0]; const { data: its } = cp ? await sb.from("wl_doc_item").select("*").eq("comp", cp.id).order("ordem") : { data: [] };

/* ---------- acessos ---------- */
async function chamarAcessos(corpo) {
  const { data: { session } } = await sb.auth.getSession();
  const r = await fetch(SB_URL + "/functions/v1/wl-acessos", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + session.access_token, apikey: SB_KEY }, body: JSON.stringify(corpo) });
  return r.json().catch(() => ({ erro: "Falha de conexão." }));
}
async function vAcessos(c, escId = S.esc.id, escNome = S.esc.nome) {
  const [{ data: ms }, { data: lig }, cls] = await Promise.all([

  ]);
  const PAP = { admin: "Administrador", equipe: "Equipe", cliente: "Cliente" };
  const cliDe = (u) => { const l = (lig || []).find((x) => x.user_id === u); const cl = l && cls.find((y) => y.id === l.cliente); return cl ? cl.nome : ""; };

    <div class="card tw"><table><thead><tr><th>Nome</th><th class="hm">E-mail</th><th>Tipo</th><th></th></tr></thead><tbody>
    ${(ms || []).map((m) => `<tr><td><b>${esc(m.nome)}</b>${m.papel === "cliente" && cliDe(m.user_id) ? `<div class="note">${esc(cliDe(m.user_id))}</div>` : ""}</td><td class="hm">${esc(m.email)}</td><td>${PAP[m.papel]}</td>
    <td style="text-align:right"><button class="btn ghost sm" data-sn="${m.user_id}" type="button">Nova senha</button> ${m.user_id !== S.user.id ? `<button class="btn red sm" data-rm="${m.user_id}" type="button">Remover</button>` : ""}</td></tr>`).join("") || '<tr><td colspan="4" class="empty">Nenhum acesso.</td></tr>'}</tbody></table></div>`;
  c.onclick = async (e) => {

        { k: "papel", rot: "Tipo de acesso", tipo: "select", v: cls.length ? "cliente" : "admin", ops: [["cliente", "Cliente (envia documentos)"], ["equipe", "Equipe do escritório"], ["admin", "Administrador do escritório"]] }];

      campos.push({ k: "senha", rot: "Senha provisória (8+ caracteres, letras e números) · deixe em branco se a pessoa já tem login no portal da Vital", tipo: "password", ac: "new-password" });
      const r = await dialogo("Novo acesso", campos, "Criar acesso"); if (!r) return;
      const j = await chamarAcessos({ acao: "criar", escritorio: escId, ...r });
      if (j.erro) return aviso(j.erro, false); aviso(j.existente ? "Pronto. Esta pessoa já tinha login: ela entra no Dabar com o mesmo e-mail e a mesma senha de sempre." : "Acesso criado. Passe o e-mail e a senha provisória para a pessoa."); return S.tab === "vital" ? vAcessos(c, escId, escNome) : render();

  };
}

function carregarPdfJs() {

const soDig = (s) => String(s || "").replace(/\D/g, "");
const MESES = { janeiro: 1, fevereiro: 2, "março": 3, marco: 3, abril: 4, maio: 5, junho: 6, julho: 7, agosto: 8, setembro: 9, outubro: 10, novembro: 11, dezembro: 12 };
function lerGuia(t, cls) {
  const r = { tipo: "Guia", cliente: "", competencia: "", vencimento: "", valor: "", pix: "", linha: "" };
  if (/Simples Nacional|\bDAS\b|PGDAS/i.test(t)) r.tipo = /MEI|SIMEI/i.test(t) ? "DAS-MEI" : "DAS";
  else if (/FGTS/i.test(t)) r.tipo = "FGTS";
  else if (/DCTFWeb|eSocial|Documento de Arrecada..o de Receitas Federais|\bDARF\b/i.test(t)) r.tipo = /DCTFWeb|Previdenci/i.test(t) ? "DARF Previdenciário" : "DARF";
  else if (/\bGPS\b|Guia da Previd/i.test(t)) r.tipo = "GPS";
  else if (/ICMS|\bDARE\b|\bDAE\b|GNRE/i.test(t)) r.tipo = "ICMS / DAE";
  else if (/ISS|ISSQN/i.test(t)) r.tipo = "ISS";
  const docs = (t.match(/\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2}|\d{3}\.\d{3}\.\d{3}-\d{2}/g) || []).map(soDig);
  const cl = cls.find((c) => c.documento && docs.includes(soDig(c.documento))) || cls.find((c) => c.documento && docs.some((d) => d.slice(0, 8) === soDig(c.documento).slice(0, 8) && soDig(c.documento).length === 14));
  if (cl) r.cliente = cl.id;
  const dt = (s) => { const m = s.match(/(\d{2})\/(\d{2})\/(\d{4})/); return m ? `${m[3]}-${m[2]}-${m[1]}` : ""; };
  const mv = t.match(/(?:Pagar (?:este documento )?at[ée]|Data de Vencimento|Vencimento|Pag[áa]vel at[ée])\s*:?\s*(\d{2}\/\d{2}\/\d{4})/i);
  if (mv) r.vencimento = dt(mv[1]); else { const all = (t.match(/\d{2}\/\d{2}\/\d{4}/g) || []).map(dt).sort(); r.vencimento = all[all.length - 1] || ""; }
  const mc = t.match(/(?:Per[ií]odo de Apura[çc][ãa]o|Compet[êe]ncia|Refer[êe]ncia|PA)\s*:?\s*(\d{2})\/(\d{4})/i) || t.match(/(?:Per[ií]odo de Apura[çc][ãa]o|Compet[êe]ncia)\s*:?\s*\d{2}\/(\d{2})\/(\d{4})/i);
  if (mc) r.competencia = `${mc[2]}-${mc[1]}`;
  else { const mn = t.match(/(janeiro|fevereiro|mar[çc]o|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)\s*\/?\s*(?:de\s*)?(\d{4})/i); if (mn) r.competencia = `${mn[2]}-${String(MESES[mn[1].toLowerCase()]).padStart(2, "0")}`; }
  const mvl = t.match(/(?:Valor Total do Documento|Valor Total|Total a (?:pagar|recolher)|Valor a pagar|Valor do documento|\(=\)\s*Valor Cobrado)\s*:?\s*(?:R\$\s*)?([\d.]+,\d{2})/i);
  const num = (s) => Number(s.replace(/\./g, "").replace(",", "."));
  if (mvl) r.valor = num(mvl[1]); else { const vs = (t.match(/\d{1,3}(?:\.\d{3})*,\d{2}/g) || []).map(num); if (vs.length) r.valor = Math.max(...vs); }

async function conferirGuias(files, cls) {

/* ---------- fase 3: utilidades ---------- */
function semAcento(s) { return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, ""); }
function crc16(s) { let c = 0xffff; for (let i = 0; i < s.length; i++) { c ^= s.charCodeAt(i) << 8; for (let j = 0; j < 8; j++) c = c & 0x8000 ? ((c << 1) ^ 0x1021) & 0xffff : (c << 1) & 0xffff; } return c.toString(16).toUpperCase().padStart(4, "0"); }
function pixCopiaCola(chave, nome, cidade, valor, txid) {
  const f = (id, v) => id + String(v.length).padStart(2, "0") + v;
  const mai = f("00", "br.gov.bcb.pix") + f("01", chave.trim());
  let p = f("00", "01") + f("26", mai) + f("52", "0000") + f("53", "986") + (valor ? f("54", Number(valor).toFixed(2)) : "") + f("58", "BR")
    + f("59", semAcento(nome).toUpperCase().slice(0, 25) || "RECEBEDOR") + f("60", semAcento(cidade).toUpperCase().slice(0, 15) || "BRASIL")
    + f("62", f("05", (txid || "***").replace(/[^A-Za-z0-9]/g, "").slice(0, 25) || "***")) + "6304";
  return p + crc16(p);
}

/* ---------- saúde da carteira ---------- */
async function vPainel(c) {
  const [cls] = await Promise.all([carregarClientes(), carregarEquipe()]);
  const ativos = cls.filter((x) => x.ativo), ids = ativos.map((x) => x.id), hj = hojeISO();
  const dep = S.fDep || "";
  const [{ data: comps }, { data: gs }, { data: ents }, { data: procs }, { data: msgs }] = await Promise.all([
    sb.from("wl_doc_comp").select("id, cliente, prazo").eq("escritorio", S.esc.id).eq("competencia", S.comp),
    sb.from("wl_guias").select("cliente, categoria, vencimento, valor, paga_em, recalculo_em").eq("escritorio", S.esc.id).eq("cancelada", false).is("paga_em", null),
    sb.from("wl_obrig_entrega").select("cliente, vencimento, status, wl_obrigacoes(departamento)").eq("escritorio", S.esc.id).eq("status", "aberta"),
    sb.from("wl_processo").select("cliente, status, wl_proc_modelo(departamento)").eq("escritorio", S.esc.id).eq("status", "andamento"),
    sb.from("wl_mensagens").select("cliente").eq("escritorio", S.esc.id).eq("do_escritorio", false).is("lida_em", null),
  ]);
  const cids = (comps || []).map((x) => x.id);
  const { data: its } = cids.length ? await sb.from("wl_doc_item").select("comp, status").in("comp", cids) : { data: [] };
  const okDep = (d) => !dep || (d || "") === dep;
  const L = ativos.map((cl) => {
    const cp = (comps || []).find((x) => x.cliente === cl.id), ii = cp ? (its || []).filter((i) => i.comp === cp.id) : [];
    const falta = ii.filter((i) => i.status === "pendente" || i.status === "recusado").length, conferir = ii.filter((i) => i.status === "enviado").length;
    const docAtr = cp && cp.prazo && cp.prazo < hj && falta;
    const g = (gs || []).filter((x) => x.cliente === cl.id), impV = g.filter((x) => x.categoria !== "honorario" && x.vencimento < hj).length;
    const hon = g.filter((x) => x.categoria === "honorario" && x.vencimento < hj), honV = hon.reduce((a, x) => a + Number(x.valor || 0), 0);
    const ob = (ents || []).filter((x) => x.cliente === cl.id && okDep(x.wl_obrigacoes && x.wl_obrigacoes.departamento)), obAtr = ob.filter((x) => x.vencimento < hj).length;
    const pr = (procs || []).filter((x) => x.cliente === cl.id && okDep(x.wl_proc_modelo && x.wl_proc_modelo.departamento)).length;
    const ms = (msgs || []).filter((x) => x.cliente === cl.id).length;
    const alerta = (docAtr ? 1 : 0) + impV + obAtr + (hon.length ? 1 : 0);
    return { cl, cp, falta, conferir, docAtr, impV, hon: hon.length, honV, ob: ob.length, obAtr, pr, ms, alerta };
  }).sort((a, b) => b.alerta - a.alerta || a.cl.nome.localeCompare(b.cl.nome));
  const s = (f) => L.reduce((a, x) => a + f(x), 0);
  const FP = { alerta: ["clientes com atraso", (x) => x.alerta], conferir: ["documentos para conferir", (x) => x.conferir], obAtr: ["obrigações atrasadas", (x) => x.obAtr], impV: ["guias vencidas sem pagamento", (x) => x.impV], honV: ["honorários em atraso", (x) => x.hon], pr: ["processos em andamento", (x) => x.pr] };
  const fp = FP[S.fPainel] ? S.fPainel : "", LV = fp ? L.filter((x) => FP[fp][1](x)) : L;
  const kp = (k, v, st) => `<button type="button" class="kpi" data-pfil="${k}" aria-pressed="${fp === k}"><b${st ? ` style="${st}"` : ""}>${v}</b><span>${FP[k][0]}</span></button>`;
  const deps = [...new Set(["Fiscal", "Contábil", "Pessoal", "Legal", ...ativos.map((x) => x.departamento).filter(Boolean)])];
  const cel = (n, ruim) => n ? `<span class="chip ${ruim ? "st-recusado" : "st-enviado"}">${n}</span>` : '<span class="note">—</span>';
  c.innerHTML = `<div class="row sb" style="margin-bottom:12px"><div><h2>Saúde da carteira</h2><p class="note" style="margin:0">Tudo o que está pendente ou atrasado, cliente por cliente. Os mais críticos aparecem primeiro.</p></div>
    <div class="row"><select id="pDep" style="width:auto"><option value="">Todos os departamentos</option>${deps.map((d) => `<option ${d === dep ? "selected" : ""}>${esc(d)}</option>`).join("")}</select><input id="pComp" type="month" value="${S.comp}" style="width:auto"><button class="btn sec sm" id="pLote" type="button">Tarefa para vários clientes</button></div></div>
    <div class="kpis">
      ${kp("alerta", L.filter((x) => x.alerta).length, "color:var(--err)")}${kp("conferir", s((x) => x.conferir))}${kp("obAtr", s((x) => x.obAtr))}${kp("impV", s((x) => x.impV))}${kp("honV", brl(s((x) => x.honV)))}${kp("pr", s((x) => x.pr))}</div>
    ${fp ? `<p class="note" style="margin:8px 0">Mostrando só clientes com: <b>${FP[fp][0]}</b> · <a href="#" data-pfil="">mostrar todos</a></p>` : '<p class="note" style="margin:8px 0">Toque num quadro acima para filtrar os clientes.</p>'}
    <div class="card tw">${LV.length ? `<table><thead><tr><th>Cliente</th><th>Documentos (${compBR(S.comp)})</th><th>Obrigações atrasadas</th><th class="hm">Guias vencidas</th><th class="hm">Honorários</th><th class="hm">Processos</th><th class="hm">Mensagens</th></tr></thead><tbody>
    ${LV.map((x) => `<tr><td><b>${x.alerta ? "🔴 " : "🟢 "}${linkCli(x.cl.id, x.cl.nome)}</b>${x.cl.departamento ? `<div class="note">${esc(x.cl.departamento)}</div>` : ""}</td>
      <td>${x.cp ? (x.falta ? `<span class="chip ${x.docAtr ? "st-recusado" : "st-pendente"}">faltam ${x.falta}</span>` : '<span class="chip st-aprovado">completo</span>') + (x.conferir ? ` <span class="chip st-enviado">${x.conferir} p/ conferir</span>` : "") : '<span class="note">lista não aberta</span>'}</td>
      <td>${cel(x.obAtr, true)}${x.ob - x.obAtr ? ` <span class="note">${x.ob - x.obAtr} em aberto</span>` : ""}</td><td class="hm">${cel(x.impV, true)}</td><td class="hm">${x.hon ? `<span class="chip st-recusado">${brl(x.honV)}</span>` : '<span class="note">em dia</span>'}</td><td class="hm">${cel(x.pr)}</td><td class="hm">${cel(x.ms)}</td></tr>`).join("")}</tbody></table>` : '<div class="empty">Cadastre os clientes na aba <b>Clientes</b>.</div>'}</div>`;
  $("#pDep").onchange = (e) => { S.fDep = e.target.value; render(); };

function editarModelo(m) {

    if (d.returnValue === "off") { await sb.from("wl_proc_modelo").update({ ativo: false }).eq("id", m.id); return render(); }

  const cls = (await carregarClientes()).filter((x) => x.ativo);
  const { data: mods } = await sb.from("wl_msg_modelo").select("*").eq("escritorio", S.esc.id).order("titulo");
  const r = await dlgClientes("Mensagem para vários clientes", [{ k: "mod", rot: "Modelo", tipo: "select", v: "", ops: [["", "— escrever do zero —"], ...(mods || []).map((m) => [String(m.id), m.titulo])] },
    { k: "texto", rot: "Mensagem ({cliente}, {mes} e {prazo} são preenchidos sozinhos)", tipo: "area" }], cls, { ok: "Enviar" });
  if (!r) return; const base = r.texto || ((mods || []).find((m) => String(m.id) === r.mod) || {}).texto || "";
  if (!base || !r.ids.length) return aviso("Escreva a mensagem e marque os clientes.", false);
  const me = S.membros.find((m) => m.escritorio === S.esc.id);
  const { error } = await sb.from("wl_mensagens").insert(r.ids.map((id) => ({ escritorio: S.esc.id, cliente: id, autor_nome: (me && me.nome) || "", do_escritorio: true, texto: preencherModelo(base, cls.find((x) => x.id === id)) })));
  aviso(error ? "Não foi possível enviar." : `Mensagem enviada para ${r.ids.length} cliente(s).`, !error); render();
}
async function gerirModelosMsg() {
  const { data: mods } = await sb.from("wl_msg_modelo").select("*").eq("escritorio", S.esc.id).order("titulo");
  const r = await dialogo("Modelos de mensagem", [{ k: "id", rot: "Modelo", tipo: "select", v: "", ops: [["", "+ Novo modelo"], ...(mods || []).map((m) => [String(m.id), m.titulo])] }], "Abrir");
  if (!r) return; const m = (mods || []).find((x) => String(x.id) === r.id) || {};
  const e = await dialogo(m.id ? "Editar modelo" : "Novo modelo", [{ k: "titulo", rot: "Título", v: m.titulo, req: true }, { k: "texto", rot: "Texto ({cliente}, {mes}, {prazo})", tipo: "area", v: m.texto }], "Salvar");
  if (!e || !e.titulo || !e.texto) return;
  const { error } = m.id ? await sb.from("wl_msg_modelo").update({ titulo: e.titulo, texto: e.texto }).eq("id", m.id) : await sb.from("wl_msg_modelo").insert({ escritorio: S.esc.id, titulo: e.titulo, texto: e.texto });
  aviso(error ? "Não foi possível salvar." : "Modelo salvo.", !error);
}

/* ---------- app instalável com a marca do escritório ---------- */
let promptInstalar = null;
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); promptInstalar = e; const b = $("#bInst"); if (b) b.classList.remove("hide"); });
function marcaApp(m, slug) {
  const set = (sel, attr, v) => { let el = document.querySelector(sel); if (el) el.setAttribute(attr, v); };
  const fixo = !slug || slug === "viaverde";
  if (fixo) { set("#lnkMan", "href", slug ? "m/" + slug + ".webmanifest" : "m/dabar.webmanifest"); set("#lnkApple", "href", slug ? "m/" + slug + "-180.png" : "dabar-icon.png"); }
  else if (m && m.logo_url) {
    const base = location.origin + location.pathname, ic = new URL(m.logo_url, base).href;
    const man = { name: m.nome, short_name: (m.nome || "Portal").split(" ")[0], start_url: base + "?e=" + slug, scope: base, display: "standalone", background_color: "#ffffff", theme_color: m.cor || "#4F5D33",
      icons: [{ src: ic, sizes: "192x192", type: "image/png", purpose: "any" }, { src: ic, sizes: "512x512", type: "image/png", purpose: "any" }] };
    set("#lnkMan", "href", "data:application/manifest+json," + encodeURIComponent(JSON.stringify(man))); set("#lnkApple", "href", ic);
  }
  set("#mtApp", "content", m && m.nome ? m.nome.split(" ")[0] : "Dabar");
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.navigator.standalone;
  const b = $("#bInst"); if (b && ios) b.classList.remove("hide");
}
$("#bInst") && $("#bInst").addEventListener("click", async () => {
  if (promptInstalar) { promptInstalar.prompt(); await promptInstalar.userChoice.catch(() => {}); promptInstalar = null; $("#bInst").classList.add("hide"); return; }
  await dialogo("Instalar o app", [{ tipo: "info", texto: "No iPhone: toque no botão Compartilhar (quadrado com seta) e depois em \"Adicionar à Tela de Início\". O app aparece com a logo do escritório." }], "Entendi");
});
try { if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {}); } catch { /* ok */ }

/* ---------- início ---------- */
(async () => { const slug = slugAtual(); let mk = null; if (slug) { const { data } = await sb.rpc("wl_marca", { p_slug: slug }); mk = data && data[0]; } aplicarMarca(mk || DABAR); iniciar(); })();
sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_OUT") mostrar("vLogin"); });
